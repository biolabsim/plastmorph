[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "plastmorph"
version = "0.1.0"
description = "Educational plastic degradation simulator for high school students"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Ulf Liebal", email = "ulf.liebal@rwth-aachen.de" }
  { name = "Nicole Maaßen", email = "nicole.maassen@iamb.rwth-aachen.de" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "streamlit>=1.38"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.hatch.build.targets.wheel]
include = [
  "src/plastmorph/**/*.py",
  "src/plastmorph/locales/*.toml"
]

[tool.hatch.build.targets.sdist]
include = [
  "src/plastmorph/**/*.py",
  "src/plastmorph/locales/*.toml",
  "tests/**/*.py",
  "docs/**",
  "app/**/*.py",
  "README.md",
  "mkdocs.yml",
  "Makefile"
]
